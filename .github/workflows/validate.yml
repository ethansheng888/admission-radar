name: Validate Admission Radar

on:
  push:
    branches: [main, codex/vps-migration]
    paths-ignore:
      - 'state/**'
      - 'logs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'state/**'
      - 'logs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.vps.lock
      - name: Run isolated tests
        run: python -m unittest discover -s tests -v
      - name: Read-only live school preview
        run: python main.py --config config.cloud.json --preview
