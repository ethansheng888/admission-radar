name: Admission Radar

on:
  schedule:
    # 每小时第 17 分钟运行，避开整点的 GitHub Actions 高峰。
    - cron: "17 * * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      test_email:
        description: "只测试邮件，不抓取和保存公告"
        required: false
        type: boolean
        default: false
      test_email_target:
        description: "测试邮件发给谁"
        required: false
        type: choice
        options:
          - owner
          - cufe-group
          - bjtu-friend
        default: owner

permissions:
  contents: write

concurrency:
  group: admission-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Read previous notice state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_email) }}
        id: before
        shell: bash
        run: |
          echo "count=$(python scripts/count_notices.py state/radar.db)" >> "$GITHUB_OUTPUT"
          echo "pending=$(python scripts/count_notices.py state/radar.db --pending)" >> "$GITHUB_OUTPUT"

      - name: Send test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CUFE_RECIPIENTS: ${{ secrets.CUFE_RECIPIENTS }}
          BJTU_RECIPIENT: ${{ secrets.BJTU_RECIPIENT }}
        shell: bash
        run: |
          if [ "${{ inputs.test_email_target }}" = "bjtu-friend" ]; then
            python main.py --config config.cloud.json --test-email \
              --test-email-website bjtu-master
          elif [ "${{ inputs.test_email_target }}" = "cufe-group" ]; then
            python main.py --config config.cloud.json --test-email \
              --test-email-website cufe-master
          else
            python main.py --config config.cloud.json --test-email
          fi

      - name: Check announcements
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_email) }}
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CUFE_RECIPIENTS: ${{ secrets.CUFE_RECIPIENTS }}
          BJTU_RECIPIENT: ${{ secrets.BJTU_RECIPIENT }}
        run: python main.py --config config.cloud.json

      - name: Persist state when needed
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.test_email) && steps.before.outcome == 'success' }}
        shell: bash
        env:
          BEFORE_COUNT: ${{ steps.before.outputs.count }}
          BEFORE_PENDING: ${{ steps.before.outputs.pending }}
        run: |
          set -euo pipefail
          AFTER_COUNT="$(python scripts/count_notices.py state/radar.db)"
          AFTER_PENDING="$(python scripts/count_notices.py state/radar.db --pending)"
          if [ "$AFTER_COUNT" -lt "$BEFORE_COUNT" ]; then
            echo "Notice count unexpectedly decreased."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$AFTER_COUNT" -ne "$BEFORE_COUNT" ] || \
             [ "$AFTER_PENDING" -ne "$BEFORE_PENDING" ]; then
            git add state/radar.db
          fi

          python scripts/update_heartbeat.py state/heartbeat.txt --max-age-days 30
          git add state/heartbeat.txt

          if git diff --cached --quiet; then
            echo "No persistent state change."
            exit 0
          fi

          git commit -m "chore: update admission radar state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
